<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Звёздный Код</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        h1 {
            margin-top: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
            font-size: 16px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 15px;
            background: #ff6a00;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #ff8c1a;
        }

        .result {
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>🔮 Звёздный Код</h1>
    <p>Введи свои данные</p>

    <input type="date" id="date">
    <input type="time" id="time">
    <input type="text" id="city" placeholder="Город рождения">

    <br><br>

    <button onclick="sendData()">Сделать разбор</button>

    <div class="result" id="result"></div>

</div>

<script>
    function sendData() {
        const date = document.getElementById("date").value;
        const time = document.getElementById("time").value;
        const city = document.getElementById("city").value;

        if (!date || !time || !city) {
            alert("Заполни все поля");
            return;
        }

        fetch("/calculate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                date: date,
                time: time,
                city: city
            })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById("result").innerText = data.result;
        })
        .catch(() => {
            document.getElementById("result").innerText = "Ошибка расчёта";
        });
    }
</script>

</body>
</html>
