<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Astro App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">

    <h1>Астрология нового поколения</h1>

    <input id="name" placeholder="Имя">
    <input id="birth_date" type="date">
    <input id="birth_time" type="time">
    <input id="birth_place" placeholder="Город">

    <button onclick="getAnalysis()">Получить анализ</button>

    <pre id="result"></pre>

</div>

<script>
async function getAnalysis() {
    const data = {
        name: document.getElementById('name').value,
        birth_date: document.getElementById('birth_date').value,
        birth_time: document.getElementById('birth_time').value,
        birth_place: document.getElementById('birth_place').value
    };

    const res = await fetch('/api/free-analysis', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });

    const json = await res.json();
    document.getElementById('result').textContent = json.analysis;
}
</script>

</body>
</html>
