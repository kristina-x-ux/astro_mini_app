<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroEngine</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: white;

    background:
        linear-gradient(
            rgba(20, 60, 120, 0.08),
            rgba(20, 60, 120, 0.12)
        ),
        url('/static/file_000000009a0072438087f62e212a4232.png');

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.page {
    max-width: 620px;
    margin: 0 auto;
    padding: 24px 16px 44px;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

.header {
    text-align: center;
    margin-bottom: 24px;
}

.header h1 {
    margin: 0;
    font-size: 38px;
    font-weight: 800;
    text-shadow: 0 4px 20px rgba(0,0,0,0.45);
}

.subtitle {
    margin-top: 8px;
    font-size: 15px;
    opacity: 0.9;
}

.card {
    background: rgba(0, 0, 0, 0.10);
    border: 1.5px solid rgba(255,255,255,0.45);
    border-radius: 28px;
    padding: 24px;
    margin-bottom: 22px;
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 14px 34px rgba(0, 30, 90, 0.14);
}

.card-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 16px;
}

.mode-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
}

.mode-btn {
    padding: 13px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.08);
    color: white;
    font-weight: 700;
    font-size: 15px;
}

.mode-btn.active {
    background: linear-gradient(135deg, #52b5ff, #7257ff);
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-size: 15px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;

    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.65);

    background: rgba(255,255,255,0.62);
    color: #1b2d52;

    font-size: 18px;
    outline: none;
}

input::placeholder {
    color: rgba(27,45,82,0.65);
}

.main-btn {
    width: 100%;
    margin-top: 18px;
    padding: 18px;

    border: none;
    border-radius: 24px;

    background: linear-gradient(135deg, #52b5ff, #7257ff);
    color: white;

    font-size: 19px;
    font-weight: 800;

    box-shadow: 0 10px 28px rgba(60,120,255,0.35);
}

.secondary-btn {
    width: 100%;
    margin-top: 12px;
    padding: 15px;

    border-radius: 22px;
    border: 1.5px solid rgba(255,255,255,0.55);

    background: rgba(255,255,255,0.08);
    color: white;

    font-size: 16px;
    font-weight: 700;
}

.suggestions {
    display: none;
    margin-top: -6px;
    margin-bottom: 10px;

    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(5, 22, 65, 0.92);
}

.suggestion-item {
    padding: 13px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    font-size: 15px;
    line-height: 1.35;
}

.suggestion-item:last-child {
    border-bottom: none;
}

.time-help {
    font-size: 13px;
    opacity: 0.85;
    margin-top: -4px;
    margin-bottom: 8px;
}

.top-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.back-btn {
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 16px;
    background: rgba(255,255,255,0.16);
    color: white;
    font-size: 24px;
}

.result-heading {
    font-size: 30px;
    font-weight: 850;
    line-height: 1.15;
}

.tabs {
    display: flex;
    gap: 8px;
    margin: 18px 0;
    overflow-x: auto;
}

.tab {
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.08);
    color: white;
    font-weight: 700;
    white-space: nowrap;
}

.tab.active {
    background: linear-gradient(135deg, #52b5ff, #7257ff);
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.info-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
}

.info-line {
    padding: 13px 0;
    border-bottom: 1px solid rgba(255,255,255,0.23);
    font-size: 16px;
    line-height: 1.45;
}

.table {
    width: 100%;
    border-collapse: collapse;
    overflow: hidden;
    border-radius: 18px;
    margin-top: 12px;
    background: rgba(0,0,0,0.10);
}

.table th,
.table td {
    padding: 12px 9px;
    border-bottom: 1px solid rgba(255,255,255,0.18);
    text-align: left;
    font-size: 14px;
}

.table th {
    font-size: 13px;
    opacity: 0.9;
}

.house-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 12px;
}

.house-item {
    padding: 12px 14px;
    border-radius: 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
}

.client-box {
    padding: 16px;
    margin-top: 12px;
    border-radius: 20px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.24);
    line-height: 1.5;
}

.footer {
    text-align: center;
    font-size: 13px;
    margin-top: 20px;
    opacity: 0.82;
}

.error {
    padding: 14px;
    border-radius: 18px;
    background: rgba(255, 80, 80, 0.20);
    border: 1px solid rgba(255,255,255,0.25);
    line-height: 1.4;
}
</style>
</head>

<body>

<div class="page">

    <div id="inputScreen" class="screen active">

        <div class="header">
            <h1>AstroEngine</h1>
            <div class="subtitle">Джйотиш-анализ личности и натальной карты</div>
        </div>

        <div class="card">
            <div class="card-title">Введите данные для анализа</div>

            <div class="mode-switch">
                <button class="mode-btn active" id="clientBtn" onclick="setMode('client')">🌙 Клиент</button>
                <button class="mode-btn" id="astroBtn" onclick="setMode('astro')">🧿 Астролог</button>
            </div>

            <label>Дата рождения</label>
            <input id="date" type="date">

            <label>Время рождения</label>
            <input
                id="time"
                type="text"
                inputmode="numeric"
                maxlength="5"
                placeholder="12:50"
                oninput="formatTimeInput(this)"
            >
            <div class="time-help">Введите время цифрами, например 1250 → 12:50</div>

            <label>Место рождения</label>
            <input
                id="city"
                type="text"
                placeholder="Киев, Украина"
                autocomplete="off"
                oninput="handlePlaceInput()"
            >

            <div class="suggestions" id="suggestions"></div>

            <button class="main-btn" onclick="calculate()">Запустить анализ</button>
        </div>

        <div class="footer">
            AstroEngine помогает увидеть структуру карты через язык джйотиш.
        </div>

    </div>

    <div id="resultScreen" class="screen">

        <div class="top-bar">
            <button class="back-btn" onclick="goBack()">‹</button>
            <div class="result-heading" id="resultHeading">Результат</div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="openTab('summary')">Карта</button>
            <button class="tab" onclick="openTab('planets')">Планеты</button>
            <button class="tab" onclick="openTab('houses')">Дома</button>
            <button class="tab" onclick="openTab('analysis')">Разбор</button>
        </div>

        <div class="card">

            <div id="summary" class="section active"></div>
            <div id="planets" class="section"></div>
            <div id="houses" class="section"></div>
            <div id="analysis" class="section"></div>

        </div>

        <button class="secondary-btn" onclick="goBack()">Изменить данные</button>

    </div>

</div>

<script>
let mode = "client";
let selectedPlace = null;
let placeTimer = null;
let currentChart = null;

function setMode(m) {
    mode = m;

    document.getElementById("clientBtn").classList.remove("active");
    document.getElementById("astroBtn").classList.remove("active");

    if (m === "client") {
        document.getElementById("clientBtn").classList.add("active");
    } else {
        document.getElementById("astroBtn").classList.add("active");
    }
}

function formatTimeInput(input) {
    let value = input.value.replace(/\D/g, "");

    if (value.length > 4) {
        value = value.slice(0, 4);
    }

    if (value.length >= 3) {
        value = value.slice(0, 2) + ":" + value.slice(2);
    }

    input.value = value;
}

function isValidTime(value) {
    const parts = value.split(":");

    if (parts.length !== 2) return false;

    const h = Number(parts[0]);
    const m = Number(parts[1]);

    return h >= 0 && h <= 23 && m >= 0 && m <= 59;
}

function handlePlaceInput() {
    selectedPlace = null;

    clearTimeout(placeTimer);

    const query = document.getElementById("city").value.trim();
    const box = document.getElementById("suggestions");

    if (query.length < 2) {
        box.style.display = "none";
        box.innerHTML = "";
        return;
    }

    placeTimer = setTimeout(() => {
        searchPlaces(query);
    }, 450);
}

async function searchPlaces(query) {
    const box = document.getElementById("suggestions");

    try {
        const response = await fetch(`/search_place?q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (!data.places || data.places.length === 0) {
            box.style.display = "none";
            box.innerHTML = "";
            return;
        }

        box.innerHTML = "";

        data.places.forEach(place => {
            const item = document.createElement("div");
            item.className = "suggestion-item";
            item.innerText = "📍 " + place.name;

            item.onclick = () => {
                selectedPlace = place;
                document.getElementById("city").value = place.name;
                box.style.display = "none";
                box.innerHTML = "";
            };

            box.appendChild(item);
        });

        box.style.display = "block";

    } catch {
        box.style.display = "none";
    }
}

async function calculate() {
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const city = document.getElementById("city").value.trim();

    if (!date || !time || !city) {
        alert("Заполните дату, время и место рождения.");
        return;
    }

    if (!isValidTime(time)) {
        alert("Введите время в формате 12:50.");
        return;
    }

    showResultLoading();

    try {
        const payload = {
            date: date,
            time: time,
            city: city,
            mode: mode
        };

        if (selectedPlace) {
            payload.lat = selectedPlace.lat;
            payload.lon = selectedPlace.lon;
            payload.display_name = selectedPlace.name;
        }

        const response = await fetch("/calculate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!data.success) {
            showError(data.error || "Ошибка расчёта.");
            return;
        }

        currentChart = data.chart;
        renderResult(currentChart);

    } catch {
        showError("Ошибка соединения с сервером.");
    }
}

function showResultLoading() {
    document.getElementById("inputScreen").classList.remove("active");
    document.getElementById("resultScreen").classList.add("active");

    document.getElementById("resultHeading").innerText =
        mode === "client" ? "Персональный разбор" : "Технический расчёт";

    document.getElementById("summary").innerHTML = "<div class='info-line'>Выполняю расчёт карты...</div>";
    document.getElementById("planets").innerHTML = "";
    document.getElementById("houses").innerHTML = "";
    document.getElementById("analysis").innerHTML = "";
}

function showError(message) {
    document.getElementById("summary").innerHTML =
        `<div class="error">${message}</div>`;
}

function goBack() {
    document.getElementById("resultScreen").classList.remove("active");
    document.getElementById("inputScreen").classList.add("active");
}

function openTab(id) {
    document.querySelectorAll(".section").forEach(el => el.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));

    document.getElementById(id).classList.add("active");
    event.target.classList.add("active");
}

function renderResult(chart) {
    renderSummary(chart);
    renderPlanets(chart);
    renderHouses(chart);
    renderAnalysis(chart);
}

function renderSummary(chart) {
    document.getElementById("summary").innerHTML = `
        <div class="info-grid">
            <div class="info-line">📍 Место рождения: <b>${chart.city}</b></div>
            <div class="info-line">🌍 Широта: ${chart.lat}</div>
            <div class="info-line">🌍 Долгота: ${chart.lon}</div>
            <div class="info-line">🕘 Часовой пояс: ${chart.timezone}</div>
            <div class="info-line">UTC: ${chart.utc}</div>
            <div class="info-line">Julian Day: ${chart.jd}</div>
            <div class="info-line">Айанамша Лахири: ${chart.ayanamsha}°</div>
            <div class="info-line">🌅 Лагна: <b>${chart.lagna.sign} ${chart.lagna.degree}</b><br>Накшатра: ${chart.lagna.nakshatra}, пада ${chart.lagna.pada}</div>
            <div class="info-line">🌙 Луна: <b>${chart.moon.sign} ${chart.moon.degree}</b><br>Дом: ${chart.moon.house}<br>Накшатра: ${chart.moon.nakshatra}, пада ${chart.moon.pada}</div>
        </div>
    `;
}

function renderPlanets(chart) {
    let html = `
        <table class="table">
            <tr>
                <th>Планета</th>
                <th>Знак</th>
                <th>Дом</th>
                <th>Накшатра</th>
            </tr>
    `;

    Object.entries(chart.planets).forEach(([name, p]) => {
        html += `
            <tr>
                <td>${name}</td>
                <td>${p.sign}<br>${p.degree}</td>
                <td>${p.house}</td>
                <td>${p.nakshatra}<br>пада ${p.pada}</td>
            </tr>
        `;
    });

    html += "</table>";

    document.getElementById("planets").innerHTML = html;
}

function renderHouses(chart) {
    let html = `<div class="house-list">`;

    chart.houses.forEach(h => {
        html += `
            <div class="house-item">
                ${h.house} дом — ${h.sign}
            </div>
        `;
    });

    html += `</div>`;

    document.getElementById("houses").innerHTML = html;
}

function renderAnalysis(chart) {
    if (mode === "astro") {
        document.getElementById("analysis").innerHTML = `
            <div class="client-box">
                🧿 Это режим астролога. Здесь будут добавлены:
                <br><br>
                — варги D-1 / D-9 / D-10<br>
                — управители домов<br>
                — аспекты Парашары<br>
                — йоги<br>
                — сила планет<br>
                — Вимшоттари Даша
            </div>
        `;
    } else {
        document.getElementById("analysis").innerHTML = `
            <div class="client-box">
                🌙 Это клиентский режим. Здесь будет понятный разбор:
                <br><br>
                — сильные и слабые планеты<br>
                — как они проявляются в жизни<br>
                — какие сферы требуют внимания<br>
                — как усилить планеты<br>
                — жизненные сценарии по карте
            </div>
        `;
    }
}
</script>

</body>
</html>
