<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroEngine</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: white;
    background:
        linear-gradient(rgba(15, 30, 95, 0.12), rgba(15, 30, 95, 0.18)),
        url('/static/file_000000009a0072438087f62e212a4232.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.page {
    max-width: 680px;
    margin: 0 auto;
    padding: 18px 12px 44px;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

.header {
    text-align: center;
    margin-bottom: 22px;
}

.header h1 {
    margin: 0;
    font-size: 38px;
    font-weight: 850;
    text-shadow: 0 4px 20px rgba(0,0,0,0.45);
}

.subtitle {
    margin-top: 8px;
    font-size: 15px;
    opacity: 0.9;
}

.card {
    background: rgba(0, 20, 70, 0.24);
    border: 1.5px solid rgba(255,255,255,0.45);
    border-radius: 30px;
    padding: 18px;
    margin-bottom: 18px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.10),
        0 18px 45px rgba(0, 40, 120, 0.22);
}

.card-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 16px;
}

.mode-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
}

.mode-btn {
    padding: 13px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.08);
    color: white;
    font-weight: 700;
    font-size: 15px;
}

.mode-btn.active {
    background: linear-gradient(135deg, #52b5ff, #7257ff);
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-size: 15px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.65);
    background: rgba(255,255,255,0.70);
    color: #1b2d52;
    font-size: 18px;
    outline: none;
}

input::placeholder {
    color: rgba(27,45,82,0.55);
}

.main-btn {
    width: 100%;
    margin-top: 18px;
    padding: 18px;
    border: none;
    border-radius: 26px;
    background: linear-gradient(135deg, #4cc3ff, #6b5cff);
    color: white;
    font-size: 20px;
    font-weight: 800;
    box-shadow:
        0 10px 28px rgba(60,120,255,0.35),
        inset 0 1px 0 rgba(255,255,255,0.3);
}

.secondary-btn {
    width: 100%;
    margin-top: 12px;
    padding: 15px;
    border-radius: 22px;
    border: 1.5px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 16px;
    font-weight: 700;
}

.suggestions {
    display: none;
    margin-top: -6px;
    margin-bottom: 10px;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(5, 22, 65, 0.94);
}

.suggestion-item {
    padding: 13px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    font-size: 15px;
    line-height: 1.35;
}

.time-help {
    font-size: 13px;
    opacity: 0.85;
    margin-top: -4px;
    margin-bottom: 8px;
}

.top-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.back-btn {
    width: 46px;
    min-width: 46px;
    height: 46px;
    border: none;
    border-radius: 16px;
    background: rgba(255,255,255,0.16);
    color: white;
    font-size: 24px;
}

.result-heading {
    font-size: 28px;
    font-weight: 850;
    line-height: 1.15;
}

.info-line {
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.20);
    font-size: 15px;
    line-height: 1.45;
}

.compact-data {
    padding: 12px 14px;
    margin-bottom: 14px;
    border-radius: 18px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.20);
    font-size: 14px;
    line-height: 1.45;
}

.settings-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 8px 0 14px;
}

.action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 10px 0 14px;
}

.select-box {
    background: rgba(255,255,255,0.94);
    color: #111;
    border-radius: 18px;
    padding: 12px;
    font-size: 15px;
    border: none;
    width: 100%;
    outline: none;
}

.small-btn {
    padding: 12px;
    border: none;
    border-radius: 18px;
    background: rgba(255,255,255,0.13);
    color: white;
    font-weight: 800;
    font-size: 14px;
    border: 1px solid rgba(255,255,255,0.22);
}

.small-btn.active {
    background: linear-gradient(135deg, #52b5ff, #7257ff);
}

.drawer {
    margin-bottom: 12px;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.06);
}

.drawer-head {
    width: 100%;
    padding: 16px;
    border: none;
    background: rgba(24, 16, 95, 0.62);
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 17px;
    font-weight: 850;
    text-align: left;
}

.drawer-body {
    display: none;
    padding: 14px;
}

.drawer.open .drawer-body {
    display: block;
}

.drawer-arrow {
    transition: transform 0.2s ease;
}

.drawer.open .drawer-arrow {
    transform: rotate(90deg);
}

.chart-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #eef2ff;
    border-radius: 22px;
    overflow: hidden;
    position: relative;
    color: #202852;
    box-shadow:
        inset 0 0 35px rgba(60, 80, 160, 0.16),
        0 14px 30px rgba(0, 20, 80, 0.18);
    margin-bottom: 14px;
}

.chart-lines svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.chart-cell {
    position: absolute;
    transform: translate(-50%, -50%);
    text-align: center;
    min-width: 46px;
    max-width: 86px;
    overflow: hidden;
}

.sign-num {
    font-size: 14px;
    font-weight: 950;
    color: #24306b;
    line-height: 1;
}

.chart-planets {
    font-size: 10.5px;
    margin-top: 2px;
    color: #202852;
    font-weight: 800;
    line-height: 1.12;
    white-space: nowrap;
}

.chart-aspects {
    font-size: 10px;
    margin-top: 1px;
    color: rgba(35, 35, 50, 0.52);
    font-weight: 800;
    line-height: 1.05;
    white-space: nowrap;
}

.transit-planet {
    color: #0477ff;
}

.south-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    width: 100%;
    height: 100%;
    border: 2px solid rgba(38,48,106,0.50);
}

.south-cell {
    border: 1px solid rgba(38,48,106,0.40);
    padding: 5px;
    overflow: hidden;
}

.south-empty {
    background: rgba(255,255,255,0.36);
}

.planet-table {
    width: 100%;
    border-collapse: collapse;
    overflow: hidden;
    border-radius: 18px;
    margin-top: 12px;
    background: rgba(22, 12, 74, 0.72);
}

.planet-table th,
.planet-table td {
    padding: 10px 6px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    text-align: left;
    font-size: 12.5px;
    vertical-align: top;
}

.planet-table th {
    font-size: 11.5px;
    font-weight: 850;
    background: rgba(255,255,255,0.08);
}

.planet-table tr:nth-child(even) {
    background: rgba(255,255,255,0.06);
}

.house-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
}

.house-item {
    padding: 12px 14px;
    border-radius: 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    line-height: 1.45;
}

.client-box {
    padding: 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.24);
    line-height: 1.5;
}

.dasha-node {
    margin-bottom: 6px;
}

.dasha-row {
    width: 100%;
    padding: 12px 10px;
    border: none;
    color: white;
    display: grid;
    grid-template-columns: 24px 1fr auto;
    gap: 8px;
    align-items: center;
    background: rgba(31, 18, 88, 0.82);
    font-size: 13px;
    text-align: left;
}

.dasha-row.current {
    background: #d2ffff;
    color: #233247;
    font-weight: 850;
}

.dasha-children {
    display: none;
}

.dasha-children.open {
    display: block;
}

.level-2 .dasha-row {
    padding-left: 22px;
    background: rgba(82, 62, 145, 0.82);
}

.level-3 .dasha-row {
    padding-left: 38px;
    background: rgba(120, 105, 175, 0.72);
}

.level-4 .dasha-row {
    padding-left: 54px;
    background: rgba(160, 230, 235, 0.78);
    color: #233247;
}

.chara-row {
    padding: 11px 12px;
    margin-bottom: 6px;
    border-radius: 14px;
    background: rgba(31, 18, 88, 0.82);
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 8px;
    font-size: 13px;
}

.chara-row.current {
    background: #d2ffff;
    color: #233247;
    font-weight: 850;
}

.transit-panel {
    display: none;
    padding: 12px;
    margin-bottom: 14px;
    border-radius: 20px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.20);
}

.transit-panel.active {
    display: block;
}

.error {
    padding: 14px;
    border-radius: 18px;
    background: rgba(255, 80, 80, 0.20);
    border: 1px solid rgba(255,255,255,0.25);
    line-height: 1.4;
}

.loader {
    width: 42px;
    height: 42px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top: 4px solid white;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 1s linear infinite;
}

.loading-box {
    text-align: center;
    padding: 30px;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="page">

    <div id="inputScreen" class="screen active">
        <div class="header">
            <h1>AstroEngine</h1>
            <div class="subtitle">Джйотиш-анализ личности и натальной карты</div>
        </div>

        <div class="card">
            <div class="card-title">Введите данные для анализа</div>

            <div class="mode-switch">
                <button class="mode-btn active" id="clientBtn" onclick="setMode('client')">🌙 Клиент</button>
                <button class="mode-btn" id="astroBtn" onclick="setMode('astro')">🧿 Астролог</button>
            </div>

            <label>Дата рождения</label>
            <input id="date" type="tel" inputmode="numeric" maxlength="10" placeholder="00.00.0000" oninput="formatDateInput(this)">

            <label>Время рождения</label>
            <input id="time" type="tel" inputmode="numeric" maxlength="8" placeholder="00:00:00" oninput="formatTimeInput(this)">
            <div class="time-help">Введите время цифрами, например 125000 → 12:50:00</div>

            <label>Место рождения</label>
            <input id="city" type="text" placeholder="Город, страна" autocomplete="off" oninput="handlePlaceInput()">

            <div class="suggestions" id="suggestions"></div>

            <button class="main-btn" onclick="calculate()">Запустить анализ</button>
        </div>
    </div>

    <div id="resultScreen" class="screen">
        <div class="top-bar">
            <button class="back-btn" onclick="goBack()">‹</button>
            <div class="result-heading" id="resultHeading">Персональный разбор</div>
        </div>

        <div class="card">
            <div id="summaryBlock"></div>

            <div class="drawer open" id="drawerChart">
                <button class="drawer-head" onclick="toggleDrawer('drawerChart')">
                    <span>Карта</span><span class="drawer-arrow">›</span>
                </button>
                <div class="drawer-body" id="chartSection"></div>
            </div>

            <div class="drawer" id="drawerPlanets">
                <button class="drawer-head" onclick="toggleDrawer('drawerPlanets')">
                    <span>Планеты и накшатры</span><span class="drawer-arrow">›</span>
                </button>
                <div class="drawer-body" id="planetsSection"></div>
            </div>

            <div class="drawer" id="drawerHouses">
                <button class="drawer-head" onclick="toggleDrawer('drawerHouses')">
                    <span>Дома</span><span class="drawer-arrow">›</span>
                </button>
                <div class="drawer-body" id="housesSection"></div>
            </div>

            <div class="drawer" id="drawerDashas">
                <button class="drawer-head" onclick="toggleDrawer('drawerDashas')">
                    <span>Периоды Вимшоттари</span><span class="drawer-arrow">›</span>
                </button>
                <div class="drawer-body" id="dashasSection"></div>
            </div>

            <div class="drawer" id="drawerCharaDashas">
                <button class="drawer-head" onclick="toggleDrawer('drawerCharaDashas')">
                    <span>Чара Даша К.Н. Рао</span><span class="drawer-arrow">›</span>
                </button>
                <div class="drawer-body" id="charaDashasSection"></div>
            </div>

            <div class="drawer" id="drawerAnalysis">
                <button class="drawer-head" onclick="toggleDrawer('drawerAnalysis')">
                    <span>Разбор</span><span class="drawer-arrow">›</span>
                </button>
                <div class="drawer-body" id="analysisSection"></div>
            </div>
        </div>

        <button class="secondary-btn" onclick="goBack()">Изменить данные</button>
    </div>

</div>

<script>
let mode = "client";
let selectedPlace = null;
let placeTimer = null;

let currentChart = null;
let transitChart = null;

let chartStyle = "north";
let currentVarga = "D1";
let viewMode = "natal";

const VARGA_LABELS = {
    "D1": "D-1 Натальная",
    "Moon": "Лунная",
    "D2": "D-2 Хора",
    "D3": "D-3 Дреккана",
    "D5": "D-5 Панчамша",
    "D6": "D-6 Шаштамша",
    "D7": "D-7 Саптамша",
    "D8": "D-8 Аштамша",
    "D9": "D-9 Навамша",
    "D10": "D-10 Дашамша",
    "D11": "D-11 Рудрамша",
    "D12": "D-12 Двадашамша",
    "D16": "D-16 Шодашамша",
    "D24": "D-24 Чатурвимшамша",
    "D30": "D-30 Тримшамша",
    "D60": "D-60 Шаштьямша",
    "D81": "D-81"
};

const PLANET_SHORT = {
    "Солнце": "Со",
    "Луна": "Лу",
    "Марс": "Ма",
    "Меркурий": "Ме",
    "Юпитер": "Юп",
    "Венера": "Ве",
    "Сатурн": "Са",
    "Уран": "Ур",
    "Нептун": "Не",
    "Плутон": "Пл",
    "Раху": "Ра",
    "Кету": "Ке",
    "Манди": "Мн",
    "Гулика": "Гу"
};

function setMode(m) {
    mode = m;
    document.getElementById("clientBtn").classList.remove("active");
    document.getElementById("astroBtn").classList.remove("active");

    if (m === "client") {
        document.getElementById("clientBtn").classList.add("active");
    } else {
        document.getElementById("astroBtn").classList.add("active");
    }
}

function formatDateInput(input) {
    let value = input.value.replace(/\D/g, "");
    if (value.length > 8) value = value.slice(0, 8);

    if (value.length >= 5) {
        value = value.slice(0, 2) + "." + value.slice(2, 4) + "." + value.slice(4);
    } else if (value.length >= 3) {
        value = value.slice(0, 2) + "." + value.slice(2);
    }

    input.value = value;
}

function formatTimeInput(input) {
    let value = input.value.replace(/\D/g, "");
    if (value.length > 6) value = value.slice(0, 6);

    if (value.length >= 5) {
        value = value.slice(0, 2) + ":" + value.slice(2, 4) + ":" + value.slice(4);
    } else if (value.length >= 3) {
        value = value.slice(0, 2) + ":" + value.slice(2);
    }

    input.value = value;
}

function normalizeDate(value) {
    let digits = value.replace(/\D/g, "");
    if (digits.length !== 8) return "";
    return digits.slice(0, 2) + "." + digits.slice(2, 4) + "." + digits.slice(4, 8);
}

function normalizeTime(value) {
    let digits = value.replace(/\D/g, "");
    if (digits.length === 4) digits += "00";
    if (digits.length !== 6) return "";
    return digits.slice(0, 2) + ":" + digits.slice(2, 4) + ":" + digits.slice(4, 6);
}

function isValidDate(value) {
    return /^\d{2}\.\d{2}\.\d{4}$/.test(value);
}

function isValidTime(value) {
    if (!/^\d{2}:\d{2}:\d{2}$/.test(value)) return false;

    const parts = value.split(":");
    const h = Number(parts[0]);
    const m = Number(parts[1]);
    const s = Number(parts[2]);

    return h >= 0 && h <= 23 && m >= 0 && m <= 59 && s >= 0 && s <= 59;
}

function handlePlaceInput() {
    selectedPlace = null;
    clearTimeout(placeTimer);

    const query = document.getElementById("city").value.trim();
    const box = document.getElementById("suggestions");

    if (query.length < 2) {
        box.style.display = "none";
        box.innerHTML = "";
        return;
    }

    placeTimer = setTimeout(() => searchPlaces(query), 450);
}

async function searchPlaces(query) {
    const box = document.getElementById("suggestions");

    try {
        const response = await fetch(`/search_place?q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (!data.places || data.places.length === 0) {
            box.style.display = "none";
            box.innerHTML = "";
            return;
        }

        box.innerHTML = "";

        data.places.forEach(place => {
            const item = document.createElement("div");
            item.className = "suggestion-item";
            item.innerText = "📍 " + place.name;

            item.onclick = () => {
                selectedPlace = place;
                document.getElementById("city").value = place.name;
                box.style.display = "none";
                box.innerHTML = "";
            };

            box.appendChild(item);
        });

        box.style.display = "block";

    } catch {
        box.style.display = "none";
    }
}

async function calculate() {
    let date = document.getElementById("date").value;
    let time = document.getElementById("time").value;
    const city = document.getElementById("city").value.trim();

    date = normalizeDate(date);
    time = normalizeTime(time);

    document.getElementById("date").value = date;
    document.getElementById("time").value = time;

    if (!date || !time || !city) {
        alert("Заполните дату, время и место рождения.");
        return;
    }

    if (!isValidDate(date)) {
        alert("Введите дату в формате 00.00.0000.");
        return;
    }

    if (!isValidTime(time)) {
        alert("Введите время в формате 00:00:00.");
        return;
    }

    showResultLoading();

    try {
        const payload = {
            date: date,
            time: time,
            city: city,
            mode: mode,
            display_name: city
        };

        if (selectedPlace) {
            payload.lat = selectedPlace.lat;
            payload.lon = selectedPlace.lon;
            payload.display_name = selectedPlace.name;
        }

        const response = await fetch("/calculate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!data.success) {
            showError(data.error || "Ошибка расчёта.");
            return;
        }

        currentChart = data.chart;
        transitChart = null;
        currentVarga = "D1";
        chartStyle = "north";
        viewMode = "natal";
        renderResult(currentChart);

    } catch {
        showError("Ошибка соединения с сервером.");
    }
}

function showResultLoading() {
    document.getElementById("inputScreen").classList.remove("active");
    document.getElementById("resultScreen").classList.add("active");

    document.getElementById("resultHeading").innerText =
        mode === "client" ? "Персональный разбор" : "Технический расчёт";

    document.getElementById("summaryBlock").innerHTML = "";
    document.getElementById("chartSection").innerHTML = `
        <div class="loading-box">
            <div class="loader"></div>
            Выполняю расчёт карты...
        </div>
    `;
}

function showError(message) {
    document.getElementById("chartSection").innerHTML = `<div class="error">${message}</div>`;
}

function goBack() {
    document.getElementById("resultScreen").classList.remove("active");
    document.getElementById("inputScreen").classList.add("active");
}

function toggleDrawer(id) {
    document.getElementById(id).classList.toggle("open");
}

function renderResult(chart) {
    renderSummary(chart);
    renderChartSection(chart);
    renderPlanets();
    renderHouses(chart);
    renderDashas(chart);
    renderCharaDashas(chart);
    renderAnalysis(chart);
}

function renderSummary(chart) {
    const compact = `${chart.input_date} ${chart.input_time} ${chart.utc_offset}, ${chart.lat}, ${chart.lon}`;

    document.getElementById("summaryBlock").innerHTML = `
        <div class="compact-data">
            <b>${chart.city}</b><br>
            ${compact}<br>
            Айанамша Лахири: ${chart.ayanamsha}°
        </div>
    `;
}

function renderChartSection(chart) {
    const vargaOptions = Object.keys(VARGA_LABELS).map(key => {
        const selected = key === currentVarga ? "selected" : "";
        return `<option value="${key}" ${selected}>${VARGA_LABELS[key]}</option>`;
    }).join("");

    document.getElementById("chartSection").innerHTML = `
        <div class="settings-row">
            <select class="select-box" onchange="changeChartStyle(this.value)">
                <option value="north" ${chartStyle === "north" ? "selected" : ""}>Северо-индийская</option>
                <option value="south" ${chartStyle === "south" ? "selected" : ""}>Южно-индийская</option>
            </select>

            <select class="select-box" onchange="changeVarga(this.value)">
                ${vargaOptions}
            </select>
        </div>

        <div class="action-row">
            <button class="small-btn active" id="natalBtn" onclick="setViewMode('natal')">Натал</button>
            <button class="small-btn" id="overlayBtn" onclick="setViewMode('overlay')">Наложение</button>
        </div>

        <div class="action-row">
            <button class="small-btn" onclick="toggleTransitPanel('transit')">Транзиты</button>
            <button class="small-btn" onclick="toggleTransitPanel('rectification')">Ректификация</button>
        </div>

        <div id="transitPanel" class="transit-panel">
            <label>Дата транзита</label>
            <input id="transitDate" type="tel" inputmode="numeric" maxlength="10" placeholder="00.00.0000" oninput="formatDateInput(this)">

            <label>Время транзита</label>
            <input id="transitTime" type="tel" inputmode="numeric" maxlength="8" placeholder="00:00:00" oninput="formatTimeInput(this)">

            <label>Место транзита</label>
            <input id="transitCity" type="text" placeholder="Город, страна">

            <button class="main-btn" onclick="calculateTransit()">Рассчитать транзит</button>
        </div>

        <div id="rectificationPanel" class="transit-panel">
            <label>Новое время рождения</label>
            <input id="rectTime" type="tel" inputmode="numeric" maxlength="8" placeholder="00:00:00" oninput="formatTimeInput(this)">

            <button class="main-btn" onclick="calculateRectification()">Пересчитать карту</button>
        </div>

        <div id="chartBlock"></div>
    `;

    renderChartBlock();
}

function changeChartStyle(value) {
    chartStyle = value;
    renderChartSection(currentChart);
    renderPlanets();
}

function changeVarga(value) {
    currentVarga = value;
    renderChartSection(currentChart);
    renderPlanets();
}

function setViewMode(value) {
    viewMode = value;

    document.getElementById("natalBtn").classList.remove("active");
    document.getElementById("overlayBtn").classList.remove("active");

    if (value === "natal") {
        document.getElementById("natalBtn").classList.add("active");
    } else {
        document.getElementById("overlayBtn").classList.add("active");
    }

    renderChartBlock();
    renderPlanets();
}

function toggleTransitPanel(panel) {
    document.getElementById("transitPanel").classList.remove("active");
    document.getElementById("rectificationPanel").classList.remove("active");

    if (panel === "transit") {
        document.getElementById("transitPanel").classList.add("active");
    } else {
        document.getElementById("rectificationPanel").classList.add("active");
    }
}

function getChartByMode() {
    if (viewMode === "overlay" && transitChart) {
        return transitChart;
    }

    return currentChart;
}

function getActiveChartObject(chart) {
    if (!chart) return null;

    if (currentVarga === "D1") {
        return {
            chart_view: chart.chart_view || [],
            planets: chart.planets || {},
            aspects: chart.aspects || [],
            houses: chart.houses || [],
            special_points: chart.special_points || {}
        };
    }

    if (chart.vargas && chart.vargas[currentVarga]) {
        return chart.vargas[currentVarga];
    }

    return {
        chart_view: chart.chart_view || [],
        planets: chart.planets || {},
        aspects: chart.aspects || [],
        houses: chart.houses || [],
        special_points: chart.special_points || {}
    };
}

function getNatalActiveObject() {
    return getActiveChartObject(currentChart);
}

function getTransitActiveObject() {
    if (!transitChart) return null;
    return getActiveChartObject(transitChart);
}

function getAspectMap(activeObject) {
    const map = {};
    if (!activeObject || !activeObject.aspects) return map;

    activeObject.aspects.forEach(a => {
        a.aspects_houses.forEach(house => {
            if (!map[house]) map[house] = [];
            map[house].push(a.planet_short || PLANET_SHORT[a.planet] || a.planet);
        });
    });

    return map;
}

function renderChartBlock() {
    const block = document.getElementById("chartBlock");
    if (!block || !currentChart) return;

    const natalObject = getNatalActiveObject();
    const transitObject = getTransitActiveObject();

    if (chartStyle === "south") {
        renderSouthIndianChart(block, natalObject, transitObject);
    } else {
        renderNorthIndianChart(block, natalObject, transitObject);
    }
}

function renderNorthIndianChart(block, natalObject, transitObject) {
    const positions = [
        [50, 22],
        [28, 19],
        [13, 36],
        [27, 50],
        [13, 66],
        [28, 81],
        [50, 78],
        [72, 81],
        [87, 66],
        [73, 50],
        [87, 36],
        [72, 19]
    ];

    const aspectMap = getAspectMap(viewMode === "overlay" && transitObject ? transitObject : natalObject);
    let cells = "";

    natalObject.chart_view.forEach((h, index) => {
        const pos = positions[index];

        const natalPlanets = (h.planets || [])
            .map(p => `<div class="chart-planets">${p}</div>`)
            .join("");

        let transitPlanets = "";

        if (viewMode === "overlay" && transitObject) {
            const transitHouse = transitObject.chart_view.find(x => x.house === h.house);
            transitPlanets = (transitHouse?.planets || [])
                .map(p => `<div class="chart-planets transit-planet">T ${p}</div>`)
                .join("");
        }

        const aspects = (aspectMap[h.house] || [])
            .map(p => `<div class="chart-aspects">${p}</div>`)
            .join("");

        cells += `
            <div class="chart-cell" style="left:${pos[0]}%;top:${pos[1]}%;">
                <div class="sign-num">${h.sign}</div>
                ${natalPlanets}
                ${transitPlanets}
                ${aspects}
            </div>
        `;
    });

    block.innerHTML = `
        <div class="chart-wrap">
            <div class="chart-lines">
                <svg viewBox="0 0 100 100">
                    <rect x="1" y="1" width="98" height="98" fill="none" stroke="rgba(37,47,110,.58)" stroke-width="1.6"/>
                    <line x1="1" y1="1" x2="99" y2="99" stroke="rgba(37,47,110,.58)" stroke-width="1.6"/>
                    <line x1="99" y1="1" x2="1" y2="99" stroke="rgba(37,47,110,.58)" stroke-width="1.6"/>
                    <polygon points="50,1 99,50 50,99 1,50" fill="none" stroke="rgba(37,47,110,.58)" stroke-width="1.6"/>
                    <line x1="1" y1="50" x2="50" y2="1" stroke="rgba(37,47,110,.58)" stroke-width="1"/>
                    <line x1="50" y1="1" x2="99" y2="50" stroke="rgba(37,47,110,.58)" stroke-width="1"/>
                    <line x1="99" y1="50" x2="50" y2="99" stroke="rgba(37,47,110,.58)" stroke-width="1"/>
                    <line x1="50" y1="99" x2="1" y2="50" stroke="rgba(37,47,110,.58)" stroke-width="1"/>
                </svg>
            </div>
            ${cells}
        </div>
    `;
}

function renderSouthIndianChart(block, natalObject, transitObject) {
    const bySign = {};
    const transitBySign = {};
    const aspectMap = getAspectMap(viewMode === "overlay" && transitObject ? transitObject : natalObject);

    natalObject.chart_view.forEach(h => {
        bySign[h.sign] = h;
    });

    if (viewMode === "overlay" && transitObject) {
        transitObject.chart_view.forEach(h => {
            transitBySign[h.sign] = h;
        });
    }

    const grid = [
        12, 1, 2, 3,
        11, 0, 0, 4,
        10, 0, 0, 5,
        9, 8, 7, 6
    ];

    let html = `<div class="chart-wrap"><div class="south-grid">`;

    grid.forEach(signNumber => {
        if (signNumber === 0) {
            html += `<div class="south-cell south-empty"></div>`;
            return;
        }

        const h = bySign[signNumber] || {house: "", planets: []};
        const t = transitBySign[signNumber] || {planets: []};

        const natalPlanets = (h.planets || [])
            .map(p => `<div class="chart-planets">${p}</div>`)
            .join("");

        const transitPlanets = (t.planets || [])
            .map(p => `<div class="chart-planets transit-planet">T ${p}</div>`)
            .join("");

        const aspects = (aspectMap[h.house] || [])
            .map(p => `<div class="chart-aspects">${p}</div>`)
            .join("");

        html += `
            <div class="south-cell">
                <div class="sign-num">${signNumber}</div>
                ${natalPlanets}
                ${transitPlanets}
                ${aspects}
            </div>
        `;
    });

    html += `</div></div>`;
    block.innerHTML = html;
}

function renderPlanets() {
    const chartForTable = getChartByMode();
    const activeObject = getActiveChartObject(chartForTable);

    if (!activeObject) return;

    let html = `
        <table class="planet-table">
            <tr>
                <th>Объект</th>
                <th>Знак</th>
                <th>Градусы</th>
                <th>Накшатра</th>
            </tr>
    `;

    if (currentVarga === "D1" && chartForTable.lagna) {
        html += `
            <tr>
                <td><b>Лагна</b></td>
                <td>${chartForTable.lagna.sign_number}<br>${chartForTable.lagna.sign}<br>дом 1</td>
                <td>${chartForTable.lagna.degree}</td>
                <td>${chartForTable.lagna.nakshatra}<br>пада ${chartForTable.lagna.pada}</td>
            </tr>
        `;
    }

    Object.entries(activeObject.planets || {}).forEach(([name, p]) => {
        const karaka = p.karaka ? `<b>${p.karaka}</b> ` : "";
        const nak = p.nakshatra ? `${p.nakshatra}<br>пада ${p.pada}` : "—";

        html += `
            <tr>
                <td>${karaka}${name}</td>
                <td>${p.sign_number}<br>${p.sign}<br>дом ${p.house}</td>
                <td>${p.degree || "—"}</td>
                <td>${nak}</td>
            </tr>
        `;
    });

    html += "</table>";
    document.getElementById("planetsSection").innerHTML = html;
}

function renderHouses(chart) {
    let html = `<div class="house-list">`;

    chart.houses.forEach(h => {
        html += `<div class="house-item">${h.house} дом — знак ${h.sign_number} (${h.sign})</div>`;
    });

    html += `</div>`;
    document.getElementById("housesSection").innerHTML = html;
}

function renderDashas(chart) {
    document.getElementById("dashasSection").innerHTML = `
        <div class="client-box">
            <b>Периоды Вимшоттари</b><br>
            Даша рождения: ${chart.dashas.birth_lord}
        </div>
        <div id="dashaTree"></div>
    `;

    renderDashaNodes(chart.dashas.tree || [], document.getElementById("dashaTree"));
}

function renderDashaNodes(nodes, container) {
    container.innerHTML = "";

    nodes.forEach((node, index) => {
        container.appendChild(createDashaNode(node, index));
    });
}

function createDashaNode(node, index) {
    const wrap = document.createElement("div");
    wrap.className = `dasha-node level-${node.level}`;

    const row = document.createElement("button");
    row.className = "dasha-row" + (node.is_current ? " current" : "");

    const hasChildren = node.children && node.children.length > 0;

    row.innerHTML = `
        <span>${hasChildren ? "›" : ""}</span>
        <span>${node.path.join(" / ")}</span>
        <span>${node.start} — ${node.end}</span>
    `;

    const childrenBox = document.createElement("div");
    childrenBox.className = "dasha-children";

    if (hasChildren) {
        node.children.forEach((child, childIndex) => {
            childrenBox.appendChild(createDashaNode(child, childIndex));
        });

        row.onclick = () => {
            childrenBox.classList.toggle("open");
            row.querySelector("span").innerText = childrenBox.classList.contains("open") ? "⌄" : "›";
        };

        if (node.is_current || containsCurrent(node.children)) {
            childrenBox.classList.add("open");
            row.querySelector("span").innerText = "⌄";
        }
    }

    wrap.appendChild(row);
    wrap.appendChild(childrenBox);

    return wrap;
}

function containsCurrent(nodes) {
    return nodes.some(n => n.is_current || containsCurrent(n.children || []));
}

function renderCharaDashas(chart) {
    let html = `<div class="client-box"><b>Чара Даша К.Н. Рао</b></div>`;

    if (!chart.chara_dasha || chart.chara_dasha.length === 0) {
        html += `<div class="house-item">Периоды пока не рассчитаны.</div>`;
    } else {
        chart.chara_dasha.forEach(item => {
            html += `
                <div class="chara-row ${item.is_current ? "current" : ""}">
                    <div>${item.sign_number}</div>
                    <div>${item.sign}<br>${item.start} — ${item.end}</div>
                </div>
            `;
        });
    }

    document.getElementById("charaDashasSection").innerHTML = html;
}

function renderAnalysis(chart) {
    document.getElementById("analysisSection").innerHTML = `
        <div class="client-box">
            Здесь будет ИИ-разбор по реальным данным карты:
            <br><br>
            — сила и слабость планет<br>
            — хозяева домов в домах<br>
            — йоги<br>
            — аспекты Парашары<br>
            — периоды Вимшоттари и Чара Даша<br>
            — рекомендации по усилению сфер жизни
        </div>
    `;
}

async function calculateTransit() {
    let date = document.getElementById("transitDate").value;
    let time = document.getElementById("transitTime").value;
    let city = document.getElementById("transitCity").value.trim();

    date = normalizeDate(date);
    time = normalizeTime(time);

    document.getElementById("transitDate").value = date;
    document.getElementById("transitTime").value = time;

    if (!date || !time || !city) {
        alert("Заполните дату, время и место транзита.");
        return;
    }

    try {
        const response = await fetch("/calculate_transit", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                date: date,
                time: time,
                city: city,
                display_name: city
            })
        });

        const data = await response.json();

        if (!data.success) {
            alert(data.error || "Ошибка расчёта транзита.");
            return;
        }

        transitChart = data.transit;
        viewMode = "overlay";
        renderChartSection(currentChart);
        renderPlanets();

    } catch {
        alert("Ошибка соединения с сервером.");
    }
}

async function calculateRectification() {
    let rectTime = document.getElementById("rectTime").value;
    rectTime = normalizeTime(rectTime);
    document.getElementById("rectTime").value = rectTime;

    if (!rectTime) {
        alert("Введите новое время рождения.");
        return;
    }

    try {
        const response = await fetch("/rectification", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                date: currentChart.input_date,
                time: rectTime,
                city: currentChart.city,
                display_name: currentChart.city
            })
        });

        const data = await response.json();

        if (!data.success) {
            alert(data.error || "Ошибка ректификации.");
            return;
        }

        currentChart = data.chart;
        transitChart = null;
        viewMode = "natal";
        currentVarga = "D1";
        renderResult(currentChart);

    } catch {
        alert("Ошибка соединения с сервером.");
    }
}
</script>
