<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Звёздный Код</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;

    /* 🌌 ФОН */
    background:
        linear-gradient(
            rgba(120, 170, 255, 0.35),
            rgba(200, 220, 255, 0.4)
        ),
        url('/static/file_000000009a0072438087f62e212a4232.png');

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color: white;
}

/* Контейнер */
.container {
    max-width: 420px;
    margin: auto;
    padding: 20px;
}

/* Заголовок */
h1 {
    text-align: center;
    margin-top: 20px;
    font-size: 28px;
}

/* Карточки */
.card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 20px;
    margin-top: 20px;
    box-shadow: 0 0 25px rgba(0,0,0,0.2);
}

/* Поля */
input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    outline: none;
}

/* Кнопка */
button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border-radius: 14px;
    border: none;

    background: linear-gradient(45deg, #5aa9ff, #7b61ff);
    color: white;
    font-weight: bold;
    font-size: 16px;

    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

/* Блок результата */
.result {
    white-space: pre-line;
    margin-top: 15px;
}
</style>

</head>

<body>

<div class="container">

<h1>✨ Звёздный Код ✨</h1>

<div class="card">
    <h3>Введите данные</h3>

    <input id="date" type="date">
    <input id="time" type="time">
    <input id="city" placeholder="Город рождения">

    <button onclick="calc()">✨ Сделать разбор</button>
</div>

<div class="card">
    <h3>✨ Джйотиш-расчёт</h3>
    <div class="result" id="result">
        Здесь появится результат...
    </div>
</div>

</div>

<script>
function calc() {
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const city = document.getElementById("city").value;

    document.getElementById("result").innerText =
        "📍 Город: " + city + "\n" +
        "📅 Дата: " + date + "\n" +
        "⏰ Время: " + time + "\n\n" +
        "✨ Расчёт скоро будет здесь...";
}
</script>

</body>
</html>
