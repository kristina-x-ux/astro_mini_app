<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AstroEngine</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
    background: linear-gradient(180deg, #0d1b2a, #1b263b);
}

.container {
    padding: 20px;
    max-width: 500px;
    margin: auto;
}

.title {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 20px;
}

.input {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border-radius: 15px;
    border: none;
    font-size: 18px;
    background: rgba(255,255,255,0.15);
    color: white;
}

.input::placeholder {
    color: rgba(255,255,255,0.6);
}

.label {
    margin-top: 20px;
    font-size: 14px;
    opacity: 0.8;
}

.btn {
    margin-top: 30px;
    padding: 16px;
    width: 100%;
    border: none;
    border-radius: 20px;
    font-size: 18px;
    font-weight: bold;
    background: linear-gradient(90deg, #4facfe, #00f2fe);
    color: white;
}

.suggestions {
    background: #1b263b;
    border-radius: 10px;
    margin-top: 5px;
}

.suggestion {
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<div class="container">

<div class="title">✨ AstroEngine</div>

<div class="label">Дата рождения</div>
<input id="date" class="input" placeholder="16.05.1987">

<div class="label">Время рождения</div>
<input id="time" class="input" placeholder="12:50:00">

<div class="label">Место рождения</div>
<input id="city" class="input" placeholder="Киев">
<div id="suggestions" class="suggestions"></div>

<button class="btn" onclick="start()">Запустить анализ</button>

</div>

<script>

// --- ГОРОДА (чтобы не ломалось) ---
const cities = ["Киев", "Москва", "Сочи", "Ялта", "Минск", "Алматы"];

document.getElementById("city").addEventListener("input", function() {
    let val = this.value.toLowerCase();
    let list = document.getElementById("suggestions");
    list.innerHTML = "";

    cities.forEach(c => {
        if (c.toLowerCase().includes(val) && val.length > 0) {
            let div = document.createElement("div");
            div.className = "suggestion";
            div.innerText = c;
            div.onclick = () => {
                document.getElementById("city").value = c;
                list.innerHTML = "";
            };
            list.appendChild(div);
        }
    });
});

// --- ПРОВЕРКА ДАТЫ ---
function validDate(date) {
    return /^\d{2}\.\d{2}\.\d{4}$/.test(date);
}

// --- ПРОВЕРКА ВРЕМЕНИ ---
function validTime(time) {
    return /^\d{2}:\d{2}:\d{2}$/.test(time);
}

// --- ЗАПУСК ---
function start() {
    let date = document.getElementById("date").value;
    let time = document.getElementById("time").value;
    let city = document.getElementById("city").value;

    if (!validDate(date)) {
        alert("Дата должна быть в формате 16.05.1987");
        return;
    }

    if (!validTime(time)) {
        alert("Время должно быть в формате 12:50:00");
        return;
    }

    if (!city) {
        alert("Введите город");
        return;
    }

    fetch("/calculate", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            date: date,
            time: time,
            city: city
        })
    })
    .then(res => res.json())
    .then(data => {
        console.log(data);
        window.location.href = "/result";
    })
    .catch(err => {
        alert("Ошибка сервера");
        console.log(err);
    });
}

</script>

</body>
</html>
