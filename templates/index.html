<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Звёздный Код</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: white;

    background:
        linear-gradient(
            rgba(120,170,255,0.05),
            rgba(180,220,255,0.08)
        ),
        url('/static/file_000000009a0072438087f62e212a4232.png');

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.page {
    max-width: 620px;
    margin: 0 auto;
    padding: 24px 16px 40px;
}

.header {
    text-align: center;
    margin-bottom: 24px;
}

.header h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 800;
    text-shadow: 0 4px 18px rgba(0,0,0,0.5);
}

.subtitle {
    margin-top: 8px;
    font-size: 15px;
    opacity: 0.85;
}

/* 🔥 ТЕПЕРЬ РЕАЛЬНО ПРОЗРАЧНО */
.card {
    background: rgba(0, 0, 0, 0.08); /* почти невидимый */
    backdrop-filter: none;

    border: 1.5px solid rgba(255,255,255,0.45);
    border-radius: 28px;

    padding: 24px;
    margin-bottom: 22px;

    box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 14px 34px rgba(0, 30, 90, 0.12);
}

.card-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 14px;
}

/* режим */
.mode-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
}

.mode-btn {
    padding: 12px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    color: white;
    font-weight: 600;
}

.mode-btn.active {
    background: linear-gradient(135deg, #56b9ff, #755cff);
}

/* поля */
label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;

    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.65);

    background: rgba(255,255,255,0.55);
    color: #1b2d52;

    font-size: 16px;
}

/* кнопка */
.main-btn {
    width: 100%;
    margin-top: 16px;
    padding: 17px;

    border: none;
    border-radius: 22px;

    background: linear-gradient(135deg, #52b5ff, #7257ff);
    color: white;

    font-size: 18px;
    font-weight: 800;

    box-shadow: 0 10px 28px rgba(60,120,255,0.35);
}

/* результат */
.result-card {
    display: none;
}

.result-title {
    font-size: 21px;
    font-weight: 800;
    margin-bottom: 12px;
}

.result {
    white-space: pre-line;
    line-height: 1.5;
    font-size: 15px;
}

.loading {
    opacity: 0.8;
    font-style: italic;
}

.footer {
    text-align: center;
    font-size: 13px;
    margin-top: 20px;
    opacity: 0.85;
}

</style>
</head>

<body>

<div class="page">

    <div class="header">
        <h1>✨ Звёздный Код ✨</h1>
        <div class="subtitle">Джйотиш-расчёт по дате рождения</div>
    </div>

    <div class="card">
        <div class="card-title">Введите данные</div>

        <div class="mode-switch">
            <button class="mode-btn active" id="clientBtn" onclick="setMode('client')">🌙 Клиент</button>
            <button class="mode-btn" id="astroBtn" onclick="setMode('astro')">🧿 Астролог</button>
        </div>

        <label>Дата рождения</label>
        <input id="date" type="date">

        <label>Время рождения</label>
        <input id="time" type="time">

        <label>Город рождения</label>
        <input id="city" type="text" placeholder="Ялта">

        <button class="main-btn" onclick="calculate()">✨ Сделать разбор</button>
    </div>

    <div class="card result-card" id="resultCard">
        <div class="result-title" id="resultTitle">✨ Джйотиш-расчёт</div>
        <div class="result" id="result"></div>
    </div>

    <div class="footer">
        Ты — часть Вселенной. Звёзды раскрывают твой код.
    </div>

</div>

<script>

let mode = "client";

function setMode(m) {
    mode = m;

    document.getElementById("clientBtn").classList.remove("active");
    document.getElementById("astroBtn").classList.remove("active");

    if (m === "client") {
        document.getElementById("clientBtn").classList.add("active");
    } else {
        document.getElementById("astroBtn").classList.add("active");
    }
}

async function calculate() {
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const city = document.getElementById("city").value;

    const resultCard = document.getElementById("resultCard");
    const result = document.getElementById("result");
    const title = document.getElementById("resultTitle");

    resultCard.style.display = "block";
    result.innerHTML = "<span class='loading'>✨ Считаю карту...</span>";

    try {
        const response = await fetch("/calculate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ date, time, city, mode })
        });

        const data = await response.json();

        title.innerText = mode === "client"
            ? "🌙 Персональный разбор"
            : "🧿 Технический расчёт";

        result.innerText = data.result;

    } catch {
        result.innerText = "Ошибка соединения с сервером";
    }
}

</script>

</body>
</html>
